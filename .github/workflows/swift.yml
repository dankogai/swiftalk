name: CI via GitHub Actions

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ '*.*.*' ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    name: Swift ${{ matrix.swift }} on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        swift: ["6.3"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: SwiftyLab/setup-swift@v1
        with:
          swift-version: ${{ matrix.swift }}
      - uses: actions/checkout@v6
      - name: Run tests
        run: swift test -c release -Xswiftc -enable-testing -v
  js:
    name: JavaScript runtime (Node ${{ matrix.node }})
    strategy:
      matrix:
        node: ["22"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Extract the fixture corpus
        run: node js/tools/extract-fixtures.mjs
      - name: Run the JS tests
        run: cd js && npm test
